spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

spring.datasource.url=jdbc:h2:mem:postest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.mapping-resources=META-INF/orm.xml
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

providers.providerA.id=providerA
providers.providerA.latency-ms=0
providers.providerB.id=providerB
providers.providerB.latency-ms=0

routing.rules-json=[{"currency":"EUR","amountMax":500.00,"providers":["providerA"]},{"currency":"EUR","providers":["providerB"]},{"currency":"INR","amountMax":1000.00,"providers":["providerB"]}]

idempotency.ttl-seconds=3600
idempotency.in-flight-ttl-seconds=60

logging.level.com.yuno.assignment=WARN
